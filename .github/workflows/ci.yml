name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Full build & test on Windows — the primary platform. Exercises the whole
  # solution (net10.0-windows projects, Win32 P/Invoke, Windows.IntegrationTests).
  windows:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET 10 is the project's TFM (net10.0-windows). The windows-latest
      # runner image ships .NET 10 SDKs; this explicit install guarantees we
      # get it even if the image rolls forward.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SelectionAssistant.slnx

      - name: Build (Release)
        # Release config exercises the NativeAOT/trim analyzers at compile time
        # (PublishAot=true is gated behind the Release PropertyGroup in the
        # App csproj). A plain build surfaces trim warnings without paying the
        # full AOT publish cost on every push.
        run: dotnet build SelectionAssistant.slnx -c Release --no-restore /warnaserror

      - name: Test
        # ~660 tests across Core / Providers / Windows.IntegrationTests.
        # Windows.IntegrationTests need a Windows desktop session (P/Invoke +
        # clipboard/hook), which windows-latest provides.
        run: dotnet test SelectionAssistant.slnx -c Release --no-build --verbosity normal

  # Cross-platform smoke test on macOS — verifies the platform-agnostic
  # projects (Core / Providers) stay platform-agnostic: they must build and
  # pass on a non-Windows OS. This is a guardrail against accidentally
  # leaking Win32-specific code into the shared Core/Providers layers.
  # (BYH is Windows-only by design; this job does NOT signal a macOS port.)
  macos:
    name: Cross-platform smoke (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Only the net10.0 (non-Windows) projects are built here. The full
      # solution can't be built on macOS because App + Platform.Windows
      # target net10.0-windows (BYH is Windows-only). Build each cross-platform
      # project explicitly to exercise the platform-agnostic layers.
      - name: Build cross-platform projects
        run: |
          dotnet build src/SelectionAssistant.Core/SelectionAssistant.Core.csproj -c Release /warnaserror
          dotnet build src/SelectionAssistant.Providers/SelectionAssistant.Providers.csproj -c Release /warnaserror

      - name: Test cross-platform projects
        run: |
          dotnet test tests/SelectionAssistant.Core.Tests/SelectionAssistant.Core.Tests.csproj -c Release --verbosity normal
          dotnet test tests/SelectionAssistant.Providers.Tests/SelectionAssistant.Providers.Tests.csproj -c Release --verbosity normal
