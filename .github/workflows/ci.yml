name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET 10 is the project's TFM (net10.0-windows). The windows-latest
      # runner image ships .NET 10 SDKs; this explicit install guarantees we
      # get it even if the image rolls forward.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SelectionAssistant.slnx

      - name: Build (Release)
        # Release config exercises the NativeAOT/trim analyzers at compile time
        # (PublishAot=true is gated behind the Release PropertyGroup in the
        # App csproj). A plain build surfaces trim warnings without paying the
        # full AOT publish cost on every push.
        run: dotnet build SelectionAssistant.slnx -c Release --no-restore /warnaserror

      - name: Test
        # ~660 tests across Core / Providers / Windows.IntegrationTests.
        # Windows.IntegrationTests need a Windows desktop session (P/Invoke +
        # clipboard/hook), which windows-latest provides.
        run: dotnet test SelectionAssistant.slnx -c Release --no-build --verbosity normal
