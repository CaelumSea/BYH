handoff: >-
  用户验收后明确：自动隐藏对象仅是右上角三个窗口按钮，不是标题栏。最终实现使用
  BorderOnly + 36px BYH 标题栏；双箭头只切换按钮显隐布尔值，不进入 FullScreen，
  因此窗口矩形、标题和主体布局完全不变。按钮区域固定保留 138px，隐藏时仍可接收悬停，
  进入后显示、离开 650ms 后收起。标题栏拖动与双击最大化保留；三个按钮及模式开关均可
  键盘聚焦。不要恢复 FullscreenPopover 方案。QA 图位于
  artifacts/qa/REQ-027-caption-autohide/。
