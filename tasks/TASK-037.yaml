description: 明确原生双箭头全屏行为，在全屏状态提供可恢复的顶部热区与标题栏显隐控制，保留窗口按钮、Esc/退出全屏、高 DPI 和键盘可达性。
handoff: Avalonia 12 声明 FullscreenPopover 会在触顶时出现，但 BYH 当前 Windows 装饰主题的实测 UIA 树中没有生成该弹层，因此不能只依赖框架默认行为。现保留普通状态的
  原生标题栏；进入 FullScreen 后移除 36px 客户区占位，启用 18px 顶部感应区和 BYH 自绘浮出控制栏。控制栏离开 650ms 后收起，提供最小化、还原和关闭；Esc
  优先退出 自动隐藏模式，不再直接隐藏设置窗口。QA 图位于 artifacts/qa/REQ-027-fullscreen-titlebar/fullscreen-titlebar-revealed-nativeaot.png。
