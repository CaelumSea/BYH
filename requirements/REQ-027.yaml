id: REQ-027
title: BYH 皮肤自定义与运行时切换系统
status: dispatched
created: '2026-07-26T09:24:17'
updated: '2026-07-26T13:24:16'
score_kind: aesthetic
aesthetic_template: ''
acceptance_criteria:
- id: AC-1
  text: 至少提供 Ivory Jade 与一个视觉差异明显的内置皮肤；切换后所有已打开 BYH 窗口即时更新，无需重启。
  satisfied_by:
  - TASK-031
- id: AC-2
  text: 当前皮肤与用户调整项写入 %LOCALAPPDATA%\BYH\appearance.json，重启后恢复；文件损坏、皮肤缺失或资源无效时自动回退
    Ivory Jade。
  satisfied_by:
  - TASK-031
- id: AC-3
  text: 皮肤只控制语义颜色、材质、形状、阴影、字体和受限装饰资产，不得改变快捷键、布局结构、命令绑定、后台服务或数据文件。
  satisfied_by:
  - TASK-030
- id: AC-4
  text: 设置页提供皮肤列表、缩略预览、即时试用、应用、取消恢复及恢复默认操作；试用态不得提前覆盖持久配置。
  satisfied_by:
  - TASK-032
- id: AC-5
  text: 自定义编辑器至少覆盖基础背景、表面、主色、强调色、文字、边框、圆角和阴影强度，并在保存前检查必需字段、颜色格式和基本文字对比度。
  satisfied_by:
  - TASK-032
- id: AC-6
  text: 用户主题采用版本化 JSON 清单与受限图片资源，不执行外部代码、不加载用户 AXAML；非法路径、超限图片和未知 schema 版本被拒绝。
  satisfied_by:
  - TASK-032
- id: AC-7
  text: Debug 构建、核心测试和 win-x64 NativeAOT 发布通过；切换皮肤不改变 Ocean Eyes、Toolbar、Spotlight、Clipboard
    History 与 Launcher 的交互行为。
  satisfied_by:
  - TASK-030
  - TASK-031
  - TASK-032
  - TASK-033
  - TASK-034
  - TASK-035
  - TASK-036
  - TASK-037
- id: AC-8
  text: 设置窗口恢复独立的系统标题栏，使用 Windows 原生最小化、最大化、关闭、拖动、双击最大化、Snap Layout 与高 DPI 行为；主题主体从标题栏下方开始。
  satisfied_by:
  - TASK-029
  - TASK-037
- id: AC-9
  text: 右侧手机摘要卡的五个底部图标是可聚焦、可点击的真实按钮，并具有明确的悬停、按下、焦点与选中反馈。
  satisfied_by:
  - TASK-029
- id: AC-10
  text: 右侧手机摘要卡在默认、最大化与全屏尺寸下仅比中央主内容窗格略矮，宽度随可用空间适度增长；中央窗格不独占横向余量。底部 System Overview
    使用响应式高度并随全屏空间同步增高，整体比例协调且不裁切内容。
  satisfied_by:
  - TASK-033
- id: AC-11
  text: 手机底部五个按钮只切换手机卡内部的独立摘要视图，不再切换中央设置页；手机视图具有独立选中态、键盘焦点与可验证的内容变化。
  satisfied_by:
  - TASK-034
- id: AC-12
  text: 中央工作区重构为上下两个独立圆角窗格：顶部为紧凑设置搜索栏，底部为主要内容区；边框、间距和阴影延续 Ivory Jade 参考图的轻盈层次。
  satisfied_by:
  - TASK-035
- id: AC-13
  text: 设置搜索可按标题、关键词和功能定位设置项，结果可点击/键盘访问并导航到对应页面及控件；无结果与清空状态明确。
  satisfied_by:
  - TASK-035
- id: AC-14
  text: 中央内容区新增 Dashboard 默认页，展示已启用模块、常用功能、当前 Provider/Model、服务状态和本地使用频率；无历史数据时提供真实空状态，不伪造统计。
  satisfied_by:
  - TASK-036
- id: AC-15
  text: 移除设置页自绘标题栏、双箭头及窗口按钮自动隐藏模式，恢复最初稳定的独立系统标题栏；保留已经完成的最大化响应式列宽、手机卡比例与底部面板高度调整。
  satisfied_by:
  - TASK-037
