acceptance_criteria:
- id: AC-1
  text: Ocean Eyes 框选确认后按 Q，若缓存 PNG 含 QR Code / Data Matrix / Code 128 等条码，则在 ~100ms 内把解码得到的文本写入剪贴板，并在工具栏状态槽显示"已复制：{前 40 字符}"。
  satisfied_by:
  - TASK-012
- id: AC-2
  text: 框选不含任何条码或解码失败时，工具栏状态槽显示"未识别到二维码"，不修改剪贴板，不抛异常，不影响后续 F/J/Z/R/C/Enter/Esc 操作。
  satisfied_by:
  - TASK-012
- id: AC-3
  text: 若解码结果是合法 URL（http:// 或 https:// 开头），状态槽显示"已复制 URL：{前 40 字符}"，剪贴板内容为原始 URL（不自动打开浏览器）。
  satisfied_by:
  - TASK-012
- id: AC-4
  text: 引入 ZXing.Net（纯托管，MIT）作为解码库；在 Windows NativeAOT 发布下 0 trim/AOT 警告；exe 增量 ≤ +300KB。
  satisfied_by:
  - TASK-012
- id: AC-5
  text: 新增解码器纯函数单元测试 ≥ 5 个（QR 成功 / 无条码 / 多条码取置信度最高 / URL 识别 / 异常输入），整体测试套件全过。
  satisfied_by:
  - TASK-012
